title: "DH101 — Critical Making in the Age of AI | Research Archive & Portfolio"
description: "Digital Humanities 101 Spring 2026. Portfólio acadêmico e arquivo de pesquisa crítica sobre fabricação digital, inteligência artificial e cultura computacional."
baseurl: "/DH101"
url: "https://silvan1-ux.github.io"

# Build settings
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge

include:
  - pages
  - makes
  - reflections
  - ai-log
  - assets

defaults:
  - scope:
      path: ""
    values:
      layout: "default"
